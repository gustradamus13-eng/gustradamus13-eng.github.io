<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bale Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1D1A16; --panel:#26221B; --panelAlt:#312B22; --border:#3D3629;
    --kraft:#BE8A4E; --amber:#E7A93E; --green:#8FAE72; --red:#C7715A;
    --text:#F1E9DA; --textMuted:#A89A82; --textFaint:#7A6E5B;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans',sans-serif; }
  input, select, button { font-family:'IBM Plex Sans',sans-serif; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  .head { font-family:'Oswald',sans-serif; font-weight:600; }
  ::placeholder { color: var(--textFaint); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11px; color:var(--textMuted); font-weight:500;
    padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { font-size:13px; padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px 16px; }
  .grid { display:grid; gap:12px; }
  @media(min-width:640px){ .grid-4{ grid-template-columns:repeat(4,1fr); } .grid-2{ grid-template-columns:repeat(2,1fr);} }
  @media(max-width:639px){ .grid-4, .grid-2 { grid-template-columns:repeat(2,1fr); } }
  input, select { background:var(--panelAlt); border:1px solid var(--border); border-radius:6px;
    padding:8px 10px; color:var(--text); font-size:13px; outline:none; width:100%; }
  button { cursor:pointer; }
  .btn { font-weight:500; font-size:13px; padding:8px 14px; border-radius:6px; border:1px solid var(--border);
    background:var(--panelAlt); color:var(--text); display:inline-flex; align-items:center; gap:6px; }
  .btn-primary { background:var(--kraft); color:#241a0e; border:1px solid var(--kraft); }
  .btn-icon { background:none; border:none; color:var(--textFaint); padding:2px; }
  .navbtn { display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:2px;
    border-radius:6px; border:none; background:transparent; color:var(--textMuted);
    font-weight:500; font-size:14px; cursor:pointer; white-space:nowrap; border-left:3px solid transparent;
    text-align:left; width:100%; }
  .navbtn.active { background:var(--panelAlt); color:var(--amber); border-left:3px solid var(--kraft); }
  .empty { padding:36px 16px; text-align:center; color:var(--textFaint); font-size:13px;
    border:1px dashed var(--border); border-radius:8px; }
  .sidebar { background:var(--panel); border-right:1px solid var(--border); flex-shrink:0; }
  .layout { display:flex; min-height:100vh; }
  @media(max-width:639px){ .layout{ flex-direction:column; } .sidebar{ border-right:none; border-bottom:1px solid var(--border);} .sidenav{ display:flex; overflow-x:auto; } .sidelabel{ display:none; } }
  @media(min-width:640px){ .sidebar{ width:200px; } .sidenav{ display:flex; flex-direction:column; } }
</style>
</head>
<body>
<div id="root">Loading Bale Ledger…</div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
var e = React.createElement;
var useState = React.useState;
var useMemo = React.useMemo;
var useEffect = React.useEffect;
var Fragment = React.Fragment;

var API_URL = "https://script.google.com/macros/s/AKfycbwaoPCqBDNs5m7QGJkpGLboHEvWzKhj2IMbzSSmwH-rQ2RBPjhhx0EghMDTuKbdp9UO/exec";
var ROLE_OPTIONS = ["Admin", "Intake", "Sales", "Baler", "Accountant", "Viewer"];

function apiGet(params) {
  var qs = Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
  return fetch(API_URL + "?" + qs).then(function (r) { return r.json(); });
}
function apiPost(body) {
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); });
}

function loadSession() {
  try { return JSON.parse(localStorage.getItem("bl_session") || "null"); } catch (err) { return null; }
}
function saveSession(s) {
  try { localStorage.setItem("bl_session", JSON.stringify(s)); } catch (err) { /* ignore */ }
}
function clearSession() {
  try { localStorage.removeItem("bl_session"); } catch (err) { /* ignore */ }
}
function loadCache() {
  try {
    var raw = JSON.parse(localStorage.getItem("bl_cache") || "null");
    if (raw) return { purchases: raw.purchases || [], sales: raw.sales || [], baling: raw.baling || [], expenses: raw.expenses || [], hasCache: true };
  } catch (err) { /* ignore */ }
  return { purchases: [], sales: [], baling: [], expenses: [], hasCache: false };
}
function saveCache(data) {
  try { localStorage.setItem("bl_cache", JSON.stringify(data)); } catch (err) { /* ignore */ }
}

function todayStr() { return new Date().toISOString().slice(0, 10); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmtTon(n) { return (Math.round(n * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " t"; }
function fmtUSD(n) { return (n < 0 ? "-" : "") + "$" + Math.abs(Math.round(n)).toLocaleString(); }
function monthKey(d) { return d ? d.slice(0, 7) : ""; }
function monthLabel(key) {
  if (!key) return "";
  var parts = key.split("-");
  var y = Number(parts[0]), m = Number(parts[1]);
  return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "short", year: "numeric" });
}
var NAV_ALL = [
  { id: "dashboard", label: "Overview", roles: ["Admin", "Intake", "Sales", "Baler", "Accountant", "Viewer"] },
  { id: "purchases", label: "Intake", roles: ["Admin", "Intake"] },
  { id: "sales", label: "Shipments", roles: ["Admin", "Sales"] },
  { id: "baling", label: "Baling", roles: ["Admin", "Baler"] },
  { id: "expenses", label: "Expenses", roles: ["Admin", "Accountant"] },
  { id: "users", label: "Manage Users", roles: ["Admin"] }
];
var EXPENSE_CATEGORIES = ["Utilities", "Staff Wages", "Rent", "Machine Maintenance", "Truck Rental", "Fuel", "Other"];

function TrashIcon() {
  return e("svg", { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2 },
    e("path", { d: "M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6" })
  );
}
function PlusIcon() {
  return e("svg", { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2 },
    e("path", { d: "M12 5v14M5 12h14" })
  );
}

function StatCard(props) {
  var mono = props.mono !== false;
  return e("div", { className: "card" },
    e("div", { style: { fontSize: 11, color: "var(--textMuted)", marginBottom: 6 } }, props.label),
    e("div", {
      className: mono ? "mono" : "",
      style: { fontWeight: 600, fontSize: 21, color: props.accent || "var(--text)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }
    }, props.value)
  );
}

function Field(props) {
  return e("div", { style: { display: "flex", flexDirection: "column", gap: 4 } },
    e("label", { style: { fontSize: 11, color: "var(--textMuted)" } }, props.label),
    props.children
  );
}

function EmptyState(props) {
  return e("div", { className: "empty" }, props.text);
}

function MiniBarChart(props) {
  var data = props.data, keys = props.keys, colors = props.colors, height = props.height || 200;
  if (!data.length) return null;
  var max = 1;
  data.forEach(function (d) { keys.forEach(function (k) { if ((d[k] || 0) > max) max = d[k] || 0; }); });
  var barW = 100 / (data.length * (keys.length + 0.6));
  var groups = data.map(function (d, i) {
    var groupX = i * (keys.length * barW + barW * 0.6) + barW * 0.3;
    var rects = keys.map(function (k, ki) {
      var val = d[k] || 0;
      var h = (val / max) * (height - 30);
      var x = groupX + ki * barW;
      return e("rect", { key: k, x: x, y: height - 24 - h, width: barW * 0.85, height: h, fill: colors[ki], rx: "0.6" });
    });
    var label = e("text", {
      key: "label", x: groupX + (keys.length * barW) / 2, y: height - 8, fontSize: "3.6",
      fill: "var(--textMuted)", textAnchor: "middle"
    }, monthLabel(d.month).split(" ")[0]);
    return e("g", { key: d.month }, rects, label);
  });
  return e("svg", { viewBox: "0 0 100 " + height, preserveAspectRatio: "none", width: "100%", height: height }, groups);
}

function AddPanel(props) {
  return e("div", { style: { marginBottom: 18 } },
    e("button", { className: "btn btn-primary", onClick: props.onToggle },
      e(PlusIcon), " " + (props.open ? "Close" : props.label)),
    props.open && e("div", { className: "card", style: { marginTop: 12 } },
      e("div", { className: "grid grid-4", style: { marginBottom: 14 } }, props.children),
      e("button", {
        className: "btn btn-primary", onClick: props.onSave, disabled: !props.canSave,
        style: { opacity: props.canSave ? 1 : 0.5, cursor: props.canSave ? "pointer" : "not-allowed" }
      }, "Save entry")
    )
  );
}

function Login(props) {
  var nameState = useState(""); var name = nameState[0], setName = nameState[1];
  var pinState = useState(""); var pin = pinState[0], setPin = pinState[1];
  var errState = useState(""); var err = errState[0], setErr = errState[1];
  var loadingState = useState(false); var loading = loadingState[0], setLoading = loadingState[1];

  function submit() {
    if (!name || !pin) { setErr("Enter your name and PIN."); return; }
    setLoading(true); setErr("");
    apiPost({ action: "login", name: name, pin: pin }).then(function (res) {
      setLoading(false);
      if (res.ok) { props.onLogin(res.user); }
      else { setErr(res.error || "Login failed."); }
    }).catch(function () { setLoading(false); setErr("Network error — check your connection."); });
  }

  return e("div", { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" } },
    e("div", { className: "card", style: { width: 300 } },
      e("div", { className: "head", style: { fontSize: 20, marginBottom: 4 } }, "Bale Ledger"),
      e("div", { style: { fontSize: 12, color: "var(--textMuted)", marginBottom: 16 } }, "Sign in to continue"),
      e(Field, { label: "Name" }, e("input", {
        value: name, onChange: function (ev) { setName(ev.target.value); },
        onKeyDown: function (ev) { if (ev.key === "Enter") submit(); }
      })),
      e("div", { style: { height: 10 } }),
      e(Field, { label: "PIN" }, e("input", {
        type: "password", value: pin, onChange: function (ev) { setPin(ev.target.value); },
        onKeyDown: function (ev) { if (ev.key === "Enter") submit(); }
      })),
      err ? e("div", { style: { color: "var(--red)", fontSize: 12, marginTop: 10 } }, err) : null,
      e("div", { style: { marginTop: 14 } },
        e("button", { className: "btn btn-primary", onClick: submit, disabled: loading }, loading ? "Signing in…" : "Sign in")
      )
    )
  );
}

function ManageUsers(props) {
  var usersState = useState([]); var users = usersState[0], setUsers = usersState[1];
  var loadingState = useState(true); var loading = loadingState[0], setLoading = loadingState[1];
  var nameState = useState(""); var name = nameState[0], setName = nameState[1];
  var pinState = useState(""); var pin = pinState[0], setPin = pinState[1];
  var roleState = useState("Viewer"); var role = roleState[0], setRole = roleState[1];
  var msgState = useState(""); var msg = msgState[0], setMsg = msgState[1];

  function refresh() {
    setLoading(true);
    apiGet({ action: "getUsers" }).then(function (res) { setUsers(res); setLoading(false); })
      .catch(function () { setLoading(false); });
  }
  useEffect(function () { refresh(); }, []);

  function addUser() {
    if (!name || !pin) { setMsg("Name and PIN are required."); return; }
    apiPost({ action: "addUser", actorRole: props.actorRole, name: name, pin: pin, role: role }).then(function (res) {
      if (res.ok) { setName(""); setPin(""); setMsg(""); refresh(); }
      else { setMsg(res.error || "Could not add user."); }
    });
  }
  function removeUser(n) {
    apiPost({ action: "removeUser", actorRole: props.actorRole, name: n }).then(function (res) { if (res.ok) refresh(); });
  }
  function changeRole(n, newRole) {
    apiPost({ action: "updateUserRole", actorRole: props.actorRole, name: n, role: newRole }).then(function (res) { if (res.ok) refresh(); });
  }

  var rows = users.map(function (u) {
    return e("tr", { key: u.name },
      e("td", null, u.name),
      e("td", null, e("select", { value: u.role, onChange: function (ev) { changeRole(u.name, ev.target.value); } },
        ROLE_OPTIONS.map(function (r) { return e("option", { key: r }, r); }))),
      e("td", { style: { textAlign: "right" } }, e("button", { className: "btn-icon", onClick: function () { removeUser(u.name); }, "aria-label": "Remove user" }, e(TrashIcon)))
    );
  });

  return e("div", null,
    e("h1", { className: "head", style: { fontSize: 24, marginBottom: 4 } }, "Manage Users"),
    e("p", { style: { color: "var(--textMuted)", fontSize: 13, marginTop: 0, marginBottom: 20 } }, "Add employees, assign their role, or remove access."),
    e("div", { className: "card", style: { marginBottom: 20, maxWidth: 560 } },
      e("div", { className: "grid grid-4", style: { marginBottom: 14 } },
        e(Field, { label: "Name" }, e("input", { value: name, onChange: function (ev) { setName(ev.target.value); } })),
        e(Field, { label: "PIN" }, e("input", { value: pin, onChange: function (ev) { setPin(ev.target.value); } })),
        e(Field, { label: "Role" }, e("select", { value: role, onChange: function (ev) { setRole(ev.target.value); } },
          ROLE_OPTIONS.map(function (r) { return e("option", { key: r }, r); })))
      ),
      msg ? e("div", { style: { color: "var(--red)", fontSize: 12, marginBottom: 10 } }, msg) : null,
      e("button", { className: "btn btn-primary", onClick: addUser }, "Add user")
    ),
    loading ? e("div", { style: { color: "var(--textMuted)" } }, "Loading users…") :
      e("div", { style: { overflowX: "auto" } },
        e("table", null,
          e("thead", null, e("tr", null, e("th", null, "Name"), e("th", null, "Role"), e("th", null))),
          e("tbody", null, rows)
        )
      )
  );
}

function App(props) {
  var user = props.user;
  var tabState = useState("dashboard"); var tab = tabState[0], setTab = tabState[1];
  var cached = loadCache();
  var pState = useState(cached.purchases); var purchases = pState[0], setPurchases = pState[1];
  var sState = useState(cached.sales); var sales = sState[0], setSales = sState[1];
  var bState = useState(cached.baling); var baling = bState[0], setBaling = bState[1];
  var xState = useState(cached.expenses); var expenses = xState[0], setExpenses = xState[1];
  var loadingState = useState(cached.hasCache ? false : true); var loading = loadingState[0], setLoading = loadingState[1];
  var errState = useState(""); var loadErr = errState[0], setLoadErr = errState[1];

  function refreshAll() {
    return apiGet({ action: "getAll" }).then(function (res) {
      if (res.error) { setLoadErr(res.error); return; }
      var fresh = { purchases: res.purchases || [], sales: res.sales || [], baling: res.baling || [], expenses: res.expenses || [] };
      setPurchases(fresh.purchases);
      setSales(fresh.sales);
      setBaling(fresh.baling);
      setExpenses(fresh.expenses);
      setLoadErr("");
      saveCache(fresh);
    }).catch(function () { setLoadErr("Couldn't reach the server. Showing last-known data."); });
  }

  useEffect(function () {
    refreshAll().then(function () { setLoading(false); });
    var interval = setInterval(refreshAll, 30000); // quiet background refresh for shared/live updates
    return function () { clearInterval(interval); };
  }, []);

  function addRow(sheetName, entry, localSetter, localArr) {
    var withId = Object.assign({}, entry, { id: uid() });
    var optimistic = localArr.concat([withId]);
    localSetter(optimistic);
    apiPost({ action: "addRow", sheet: sheetName, actorRole: user.role, row: withId }).then(function (res) {
      if (!res.ok) { localSetter(localArr); alert(res.error || "Couldn't save that entry."); }
    }).catch(function () { localSetter(localArr); alert("Network error — entry not saved."); });
  }
  function delRow(sheetName, id, localSetter, localArr) {
    var optimistic = localArr.filter(function (r) { return r.id !== id; });
    localSetter(optimistic);
    apiPost({ action: "deleteRow", sheet: sheetName, actorRole: user.role, id: id }).then(function (res) {
      if (!res.ok) { localSetter(localArr); alert(res.error || "Couldn't delete that entry."); }
    }).catch(function () { localSetter(localArr); alert("Network error — entry not deleted."); });
  }

  function addPurchase(entry) { addRow("Purchases", entry, setPurchases, purchases); }
  function delPurchase(id) { delRow("Purchases", id, setPurchases, purchases); }
  function addSale(entry) { addRow("Sales", entry, setSales, sales); }
  function delSale(id) { delRow("Sales", id, setSales, sales); }
  function addBaling(entry) { addRow("Baling", entry, setBaling, baling); }
  function delBaling(id) { delRow("Baling", id, setBaling, baling); }
  function addExpense(entry) { addRow("Expenses", entry, setExpenses, expenses); }
  function delExpense(id) { delRow("Expenses", id, setExpenses, expenses); }

  var monthly = useMemo(function () {
    var map = {};
    function ensure(k) {
      if (!map[k]) map[k] = { month: k, kgPurchased: 0, purchaseCost: 0, kgSold: 0, salesRevenue: 0, expenses: 0, bales: 0 };
      return map[k];
    }
    purchases.forEach(function (p) {
      var net = num(p.gross) - num(p.tare);
      var r = ensure(monthKey(p.date));
      r.kgPurchased += net; r.purchaseCost += net * num(p.price);
    });
    sales.forEach(function (s) {
      var r = ensure(monthKey(s.date));
      r.kgSold += num(s.weight); r.salesRevenue += num(s.weight) * num(s.price);
    });
    expenses.forEach(function (x) { var r = ensure(monthKey(x.date)); r.expenses += num(x.amount); });
    baling.forEach(function (b) { var r = ensure(monthKey(b.date)); r.bales += num(b.bales); });
    return Object.keys(map).map(function (k) { return map[k]; })
      .sort(function (a, b) { return a.month.localeCompare(b.month); })
      .map(function (r) { return Object.assign({}, r, { netProfit: r.salesRevenue - r.purchaseCost - r.expenses }); });
  }, [purchases, sales, expenses, baling]);

  var today = todayStr();
  var currentMonthKey = today.slice(0, 7);
  var thisMonth = monthly.filter(function (m) { return m.month === currentMonthKey; })[0] ||
    { kgPurchased: 0, purchaseCost: 0, kgSold: 0, salesRevenue: 0, expenses: 0, bales: 0, netProfit: 0 };

  var todayStats = useMemo(function () {
    var kgIn = purchases.filter(function (p) { return p.date === today; })
      .reduce(function (s, p) { return s + (num(p.gross) - num(p.tare)); }, 0);
    var kgOut = sales.filter(function (s) { return s.date === today; })
      .reduce(function (s, x) { return s + num(x.weight); }, 0);
    var revenue = sales.filter(function (s) { return s.date === today; })
      .reduce(function (s, x) { return s + num(x.weight) * num(x.price); }, 0);
    var cost = purchases.filter(function (p) { return p.date === today; })
      .reduce(function (s, p) { return s + (num(p.gross) - num(p.tare)) * num(p.price); }, 0);
    var balesToday = baling.filter(function (b) { return b.date === today; })
      .reduce(function (s, b) { return s + num(b.bales); }, 0);
    return { kgIn: kgIn, kgOut: kgOut, net: revenue - cost, balesToday: balesToday };
  }, [purchases, sales, baling, today]);

  var stockOnHand = useMemo(function () {
    var totalPurchasedNet = purchases.reduce(function (s, p) { return s + (num(p.gross) - num(p.tare)); }, 0);
    var totalBalingInput = baling.reduce(function (s, b) { return s + num(b.input); }, 0);
    var totalBaleOutput = baling.reduce(function (s, b) { return s + num(b.baleWeight); }, 0);
    var totalSold = sales.reduce(function (s, x) { return s + num(x.weight); }, 0);
    var raw = totalPurchasedNet - totalBalingInput;
    var baled = totalBaleOutput - totalSold;
    return { raw: raw, baled: baled, total: raw + baled };
  }, [purchases, baling, sales]);

  var NAV = NAV_ALL.filter(function (item) { return item.roles.indexOf(user.role) !== -1; });

  var navButtons = NAV.map(function (item) {
    return e("button", {
      key: item.id,
      className: "navbtn" + (tab === item.id ? " active" : ""),
      onClick: function () { setTab(item.id); }
    }, item.label);
  });

  var content = null;
  if (loading) {
    content = e("div", { style: { color: "var(--textMuted)" } }, "Loading shared data…");
  } else if (tab === "dashboard") content = e(Dashboard, { today: todayStats, thisMonth: thisMonth, monthly: monthly, currentMonthKey: currentMonthKey, baling: baling, stockOnHand: stockOnHand });
  else if (tab === "purchases") content = e(Purchases, { items: purchases, onAdd: addPurchase, onDelete: delPurchase });
  else if (tab === "sales") content = e(Sales, { items: sales, onAdd: addSale, onDelete: delSale });
  else if (tab === "baling") content = e(Baling, { items: baling, onAdd: addBaling, onDelete: delBaling });
  else if (tab === "expenses") content = e(Expenses, { items: expenses, onAdd: addExpense, onDelete: delExpense });
  else if (tab === "users") content = e(ManageUsers, { actorRole: user.role });

  return e("div", { className: "layout" },
    e("div", { className: "sidebar" },
      e("div", {
        className: "head sidelabel",
        style: { padding: "18px", fontSize: 17, letterSpacing: 0.3, borderBottom: "1px solid var(--border)" }
      }, "Bale Ledger"),
      e("nav", { className: "sidenav", style: { padding: 8 } }, navButtons),
      e("div", {
        className: "sidelabel",
